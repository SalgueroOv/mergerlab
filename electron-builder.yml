appId: com.mergerlab.app
productName: Merger Lab
copyright: Copyright © 2026 Alejandro Salguero Oviedo

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"

# El ejecutable de PyInstaller (backend Python empaquetado en modo --onefile)
# se coloca en resources/backend antes de invocar electron-builder (ver build.sh / build.bat).
# Queda fuera del asar para poder ejecutarse como proceso independiente.
extraResources:
  - from: resources/backend
    to: backend
    filter:
      - "**/*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: "MergerLab-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "MergerLab-Setup-${version}-${arch}.${ext}"

portable:
  artifactName: "MergerLab-Portable-${version}-${arch}.${ext}"
  # El .exe portable se autoextrae a una carpeta temporal EN CADA ARRANQUE (a diferencia del
  # instalador NSIS, que solo extrae una vez). useZip cambia la compresion interna de 7z/LZMA
  # (mejor ratio, mas lenta de descomprimir) a zip (peor ratio, bastante mas rapida de
  # descomprimir), lo que reduce el tiempo de esa extraccion repetida a costa de un artefacto
  # .exe portable algo mas pesado en disco/descarga. No afecta al instalador NSIS.
  useZip: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # El auto-update en macOS (Squirrel.Mac, vía electron-updater) descarga y aplica un .zip, no
    # el .dmg -- el .dmg es solo para la instalación inicial manual. Sin este target, el updater
    # no tendría nada que descargar en macOS.
    - target: zip
      arch: [x64, arm64]
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  # Nombre general para los targets de mac (usado por "zip", que no tiene su propia sección de
  # configuración); "dmg:" de abajo lo sobreescribe específicamente para el target dmg.
  artifactName: "MergerLab-${version}-${arch}.${ext}"

dmg:
  artifactName: "MergerLab-${version}-${arch}.${ext}"

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icons/icon.png
  category: Office
  artifactName: "MergerLab-${version}-${arch}.${ext}"

# Destino de "npm run dist -- --publish always" (o equivalentes por SO): sube los instaladores
# como GitHub Release y genera los archivos latest.yml/latest-mac.yml/latest-linux.yml que lee
# electron-updater (ver electron/main.js) para saber si hay una versión más nueva. Requiere la
# variable de entorno GH_TOKEN (token personal de GitHub con permiso de escritura sobre
# releases) en la máquina desde la que se publica -- ver README, sección "Publicar una versión".
#
# IMPORTANTE: todos los artifactName de arriba usan "MergerLab" en vez de "${productName}"
# ("Merger Lab", con espacio) a propósito. GitHub sustituye los espacios por puntos al subir
# cualquier asset de un Release (p. ej. "Merger Lab-Setup-1.0.0.exe" queda como
# "Merger.Lab-Setup-1.0.0.exe" una vez subido) -- pero latest.yml/latest-mac.yml/latest-linux.yml
# se generan ANTES de subir, con el nombre original, así que si productName tuviera espacio el
# auto-update fallaría en silencio (buscaría un archivo con un nombre que ya no existe). Sin
# espacios en artifactName, el nombre nunca cambia al subirlo y este problema no puede pasar.
publish:
  provider: github
  owner: SalgueroOv
  repo: mergerlab
