<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Merger Lab</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --text: #1c1f26;
        --text-muted: #6b7280;
        --accent: #4a47d4;
        --ring: #e1e4e9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --text: #ecedef;
          --text-muted: #9aa1ac;
          --ring: #2b2f38;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
      }

      .logo {
        display: block;
      }

      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }

      .label {
        font-size: 13px;
        color: var(--text-muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <svg class="logo" width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="6" y1="6" x2="16" y2="23" stroke="var(--accent)" stroke-width="4.4" stroke-linecap="round" />
      <line x1="26" y1="6" x2="16" y2="23" stroke="var(--accent)" stroke-width="4.4" stroke-linecap="round" />
      <path d="M9,21 L23,21 L16,30 Z" fill="var(--accent)" />
    </svg>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <p class="label" id="label">Cargando…</p>
    <script src="./splash.js"></script>
  </body>
</html>
